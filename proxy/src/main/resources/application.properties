# --- Servidor ---
# Puerto del servidor (Usa variable de entorno o 8081 por defecto)
server.port=${SERVER_PORT:8081}

# --- Nombre de la aplicacion ---
spring.application.name=proxy-service

# --- KAFKA CONFIGURATION ---
# Conexión flexible: Si no defines la variable, usa la IP de la Cátedra
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:192.168.194.250:9092}

# TU ID de grupo (¡MANTÉN EL TUYO!)
spring.kafka.consumer.group-id=${KAFKA_GROUP_ID:elcomandante18}

# Configuración estándar de consumo
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Evita que la app se rompa si Kafka no está disponible al arrancar
spring.kafka.listener.auto-startup=true

# --- REDIS CONFIGURATION ---
# Conexión flexible
spring.data.redis.host=${REDIS_HOST:192.168.194.250}
spring.data.redis.port=${REDIS_PORT:6379}
# Es bueno tener un timeout para que no se cuelgue si Redis falla
spring.data.redis.timeout=2000ms

# --- BACKEND LINK (CRÍTICO) ---
# Aquí le decimos dónde está tu backend para enviarle los avisos
backend.url=${BACKEND_URL:http://localhost:8080}

# --- LOGGING ---
# Para ver menos basura de librerías y más info tuya
logging.level.root=INFO
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=INFO

# ?? AJUSTADO A TU PAQUETE: Para ver tus logs de debug (RedisService, etc)
logging.level.com.tp2025.proxy=DEBUG
# ===================================================================
# CONFIGURACIÓN MAESTRA - BACKEND
# ===================================================================

spring:
  application:
    name: backend

  # Desactivamos la gestión automática de Docker (Tú lo haces manual)
  docker:
    compose:
      enabled: false

  # --- CONFIGURACIÓN DE CORREO (FIX PARA EL ERROR DE STARTUP) ---
  # Esto crea el bean JavaMailSender aunque no tengas servidor de correo real
  mail:
    host: localhost
    port: 25
    username:
    password:
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  profiles:
    active: '@spring.profiles.active@'
    group:
      dev:
        - dev
        - api-docs
  jmx:
    enabled: false
  data:
    jpa:
      repositories:
        bootstrap-mode: deferred
  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.id.new_generator_mappings: true
      hibernate.connection.provider_disables_autocommit: true
      hibernate.cache.use_second_level_cache: true
      hibernate.cache.use_query_cache: false
      hibernate.generate_statistics: false
      hibernate.jdbc.batch_size: 25
      hibernate.order_inserts: true
      hibernate.order_updates: true
      hibernate.query.fail_on_pagination_over_collection_fetch: true
      hibernate.query.in_clause_parameter_padding: true
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
  messages:
    basename: i18n/messages
  main:
    allow-bean-definition-overriding: true
  mvc:
    problemdetails:
      enabled: true
  task:
    execution:
      thread-name-prefix: backend-task-
      pool:
        core-size: 2
        max-size: 50
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: backend-scheduling-
      pool:
        size: 2
  thymeleaf:
    mode: HTML

server:
  servlet:
    session:
      cookie:
        http-only: true

# ===================================================================
# JHipster specific properties
# ===================================================================

jhipster:
  clientApp:
    name: 'backendApp'
  mail:
    from: backend@localhost
  api-docs:
    default-include-pattern: /api/**
    management-include-pattern: /management/**
    title: Backend API
    description: Backend API documentation
    version: 0.0.1
  security:
    authentication:
      jwt:
        base64-secret: ${JWT_SECRET}
        token-validity-in-seconds: ${JWT_EXPIRATION:86400}

# ===================================================================
# Application specific properties (Tus configs del TP)
# ===================================================================

application:
  catedra:
    token: ${CATEDRA_TOKEN}
    base-url: ${CATEDRA_URL:http://192.168.194.250:8080}
  proxy:
    url: ${PROXY_URL:http://localhost:8081}
